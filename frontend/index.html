<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezno AI — Academic Literature Intelligence & Synthesis</title>
  <link rel="icon" href="assets/favicon.ico">
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell" id="app-root">
    <div class="app-container">
      
      <!-- Top Brand Header -->
      <header class="app-header">
        <div class="brand-block">
          <div class="brand-symbol">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
              <path d="M6 6h10"/>
              <path d="M6 10h10"/>
            </svg>
          </div>
          <span class="brand-wordmark">Rezno</span>
          <span class="brand-descriptor">arXiv research agent</span>
        </div>

        <div class="header-status-group">
          <div class="status-indicator" id="header-status-indicator" title="● arXiv connected (Mock Mode)" data-status="● arXiv connected (Mock Mode)">
            <span class="status-dot" id="header-status-dot"></span>
            <span id="header-status-text">arXiv connected (Mock Mode)</span>
          </div>
          <span id="session-run-counter" class="font-mono text-xs">2 queries</span>
        </div>

        <div class="header-controls">
          <button class="btn-icon" id="theme-toggle-btn" title="Toggle color mode" aria-label="Toggle color mode">
            <!-- Icon injected by script -->
          </button>
          <button class="btn-icon" id="settings-toggle-btn" title="Pipeline settings" aria-label="Pipeline settings">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Main Two-Column Split Layout -->
      <div class="workspace-split">
        
        <!-- Left Rail: Synthesis & Research Thread -->
        <aside class="rail-synthesis">
          <div class="rail-header">
            <span class="rail-title">Research Inquiries & Synthesis</span>
            <span class="rail-meta">Grounded brief</span>
          </div>

          <!-- Thread Stream -->
          <div class="thread-stream scrollbar-subtle" id="conversation-stream">
            <!-- Rendered dynamically by js/app.js -->
          </div>

          <!-- Composer Box -->
          <div class="composer-block">
            <div class="composer-box">
              <textarea 
                class="composer-textarea scrollbar-subtle" 
                id="composer-input" 
                rows="2" 
                placeholder="Ask a scientific research question (e.g., Sparse attention in long-context Transformers)…"
              ></textarea>
              <div class="composer-toolbar">
                <span class="composer-hint">Press Enter to run query</span>
                <div id="composer-btn-slot">
                  <button class="btn-send" id="btn-send-query">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="22" y1="2" x2="11" y2="13"/>
                      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                    <span>Synthesize</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </aside>

        <!-- Right Rail: Evidence Desk -->
        <main class="rail-evidence" id="evidence-desk">
          
          <!-- Unified Command Toolbar -->
          <div class="desk-toolbar">
            <div class="desk-tabs" id="desk-tabs">
              <button class="desk-tab-btn active" data-tab="papers">
                <span>Literature</span>
                <span class="tab-badge" id="badge-papers-count">0</span>
              </button>
              <button class="desk-tab-btn" data-tab="graph">
                <span>Concept Map</span>
                <span class="tab-badge" id="badge-graph-count">0</span>
              </button>
              <button class="desk-tab-btn" data-tab="compare">
                <span>Compare Runs</span>
              </button>
            </div>

            <!-- Run Selector Dropdown -->
            <div class="desk-actions">
              <select class="run-select font-mono" id="desk-run-select">
                <!-- Populated dynamically -->
              </select>
            </div>
          </div>

          <!-- Secondary Sub-Bar (Filters & Action Tools) -->
          <div class="desk-subbar" id="desk-subbar">
            <!-- Dynamic filters inserted here -->
          </div>

          <!-- Tab Content Scrollable Container -->
          <div class="desk-content scrollbar-subtle" id="desk-content">
            <!-- Literature view / Graph view / Compare view -->
          </div>

          <!-- In-App PDF Slide-Over Drawer -->
          <div class="pdf-drawer-overlay" id="pdf-drawer-overlay">
            <div class="pdf-drawer">
              <div class="pdf-drawer-header">
                <div class="min-w-0 flex-1">
                  <h3 class="text-sm font-semibold truncate" id="pdf-drawer-title">Paper Preview</h3>
                  <span class="text-xs font-mono text-muted" id="pdf-drawer-id">arXiv:0000.00000</span>
                </div>
                <div class="flex items-center gap-2">
                  <a class="btn-secondary" id="pdf-external-anchor" href="#" target="_blank" rel="noopener">
                    <span>Open in tab ↗</span>
                  </a>
                  <button class="btn-icon" id="pdf-drawer-close" title="Close document preview">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>
                </div>
              </div>
              <iframe class="pdf-frame" id="pdf-frame" src="about:blank"></iframe>
            </div>
          </div>

        </main>

      </div>
    </div>
  </div>

  <!-- Settings Popover & Backdrop -->
  <div class="popover-backdrop" id="popover-backdrop"></div>
  <div class="popover-dialog scrollbar-subtle" id="settings-popover">
    <!-- Populated by js/app.js -->
  </div>

  <!-- Vendor Scripts -->
  <script src="assets/vendor/force-graph.min.js"></script>

  <!-- Modular Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/mock_data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
