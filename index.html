<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Agent — arXiv Retrieval, Ranking, Synthesis & Concept Graph</title>
  <link rel="icon" href="assets/favicon.ico">
  
  <!-- Token System & App Styles -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app-root">
    <div class="ra-container">
      
      <!-- Top Brand Header -->
      <header class="ra-header">
        <div class="ra-brand-group">
          <div class="ra-brand-icon">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 2v7.31L4.75 20.5a1.5 1.5 0 0 0 1.34 2.25h11.82a1.5 1.5 0 0 0 1.34-2.25L14 9.31V2"/>
              <line x1="8.5" y1="2" x2="15.5" y2="2"/>
              <line x1="14" y1="9.3" x2="10" y2="9.3"/>
              <path d="M8.5 15h7"/>
            </svg>
          </div>
          <div class="ra-brand-titles">
            <h1 class="ra-brand-title">Research Agent</h1>
            <p class="ra-brand-subtitle">arXiv retrieval · ranking · synthesis · citation intelligence</p>
          </div>
        </div>
        <div class="ra-header-actions">
          <div class="ra-session-status">
            <span class="ra-status-dot"></span>
            <span>session active</span>
          </div>
          <button class="ra-icon-btn" id="ra-theme-toggle" title="Toggle theme">
            <!-- Icon injected by script -->
          </button>
        </div>
      </header>

      <!-- Main Two-Column Split Layout -->
      <main class="ra-main-split">
        
        <!-- Left Column: Conversation Rail (32%) -->
        <section class="ra-rail-left">
          <div class="ra-rail-head">
            <span class="ra-rail-title">Conversation</span>
            <span class="ra-rail-caption">grounded synthesis</span>
          </div>

          <!-- Message Scroll Region -->
          <div class="ra-message-scroll ra-scroll" id="ra-conversation-scroll">
            <!-- Dynamic message list or empty state rendered by js/app.js -->
          </div>

          <!-- Fixed Footer: Composer -->
          <div class="ra-composer-wrap">
            <div class="ra-composer-label-row">
              <span>Ask a research question</span>
              <span class="ra-keyboard-hint">Enter ↵ to send</span>
            </div>
            <div class="ra-composer-card">
              <textarea 
                class="ra-textarea ra-scroll" 
                id="ra-composer-input" 
                rows="2" 
                placeholder="Ask a research question…"
              ></textarea>
              <div class="ra-composer-actions">
                <span class="text-xs text-[var(--muted-foreground)]" id="ra-active-model-hint">arXiv · gpt-4o synthesis</span>
                <div id="ra-composer-btn-slot">
                  <button class="ra-btn-send" id="ra-btn-send">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
                    </svg>
                    <span>Send</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Right Column: Research Workspace Rail (68%) -->
        <section class="ra-rail-right" id="ra-rail-right-root">
          
          <!-- Unified Command Strip -->
          <div class="ra-command-strip">
            <div class="ra-tab-bar" id="ra-tab-bar">
              <button class="ra-tab-btn active" data-tab="papers">
                <span>Papers</span>
                <span class="ra-tab-count-pill" id="tab-pill-papers">0</span>
                <span class="ra-tab-indicator"></span>
              </button>
              <button class="ra-tab-btn" data-tab="graph">
                <span>Concept Graph</span>
                <span class="ra-tab-count-pill" id="tab-pill-graph">0</span>
              </button>
              <button class="ra-tab-btn" data-tab="compare">
                <span>Compare</span>
              </button>
            </div>

            <!-- Strip Actions -->
            <div class="ra-strip-actions">
              <div class="ra-run-pill" id="ra-strip-run-info">
                <span>Run: <strong>--</strong></span>
              </div>
              <button class="ra-icon-btn" id="ra-settings-trigger" title="Research settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Secondary Sub-Bar (Filters & Run Selector) -->
          <div class="ra-sub-bar" id="ra-sub-bar">
            <!-- Injected dynamically by active tab -->
          </div>

          <!-- Tab Content Scrollable Region -->
          <div class="ra-tab-content ra-scroll" id="ra-tab-content">
            <!-- Rendered dynamically by active tab -->
          </div>

          <!-- In-App PDF Slide-Over Drawer -->
          <div class="ra-pdf-drawer-overlay" id="ra-pdf-drawer-overlay">
            <div class="ra-pdf-drawer" id="ra-pdf-drawer">
              <div class="ra-pdf-drawer-head">
                <div class="min-w-0 flex-1">
                  <h3 class="text-sm font-semibold truncate" id="ra-pdf-drawer-title">Paper Viewer</h3>
                  <p class="text-xs text-[var(--muted-foreground)] font-mono" id="ra-pdf-drawer-id">arXiv:...</p>
                </div>
                <div class="flex items-center gap-2">
                  <a class="ra-btn-outline h-7 text-xs px-2" id="ra-pdf-external-link" href="#" target="_blank">
                    Open in Tab ↗
                  </a>
                  <button class="ra-icon-btn h-7 w-7" id="ra-pdf-close-btn" title="Close Reader">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                  </button>
                </div>
              </div>
              <iframe class="ra-pdf-frame" id="ra-pdf-iframe" src="about:blank"></iframe>
            </div>
          </div>

        </section>

      </main>
    </div>
  </div>

  <!-- Settings Popover & Overlay -->
  <div class="ra-popover-overlay" id="ra-settings-overlay"></div>
  <div class="ra-popover ra-scroll" id="ra-settings-popover"></div>

  <!-- Vendor Scripts -->
  <script src="assets/vendor/force-graph.min.js"></script>

  <!-- Application Logic -->
  <script src="js/icons.js"></script>
  <script src="js/mock_data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
