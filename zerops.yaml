# Zerops Deployment Configuration for Rezno AI (Reflex Python Web Application)
# Documentation: https://docs.zerops.io/python/how-to/build-pipeline

zerops:
  - setup: rezno-ai
    build:
      base: python@3.11
      prepareCommands:
        - python -m venv /opt/venv
        - /opt/venv/bin/pip install --upgrade pip
        - /opt/venv/bin/pip install reflex[db]==0.9.6.post2
      buildCommands:
        - /opt/venv/bin/pip install -r requirements.txt
        # Pre-compile Reflex frontend bundle (.web) for production
        - /opt/venv/bin/reflex export --frontend-only --no-zip
      deployFiles:
        - app
        - assets
        - rxconfig.py
        - pyproject.toml
        - pyrightconfig.json
        - requirements.txt
        - pipeline.py
        - plan_query.py
        - search.py
        - rank.py
        - synthesize.py
        - route.py
        - citations.py
        - bibtex.py
        - models.py
        - llm.py
        - graph.py
        - graph_layout.py
        - .web

    run:
      base: python@3.11
      prepareCommands:
        - python -m venv /opt/venv
        - /opt/venv/bin/pip install --upgrade pip
        - /opt/venv/bin/pip install -r requirements.txt
      envVariables:
        PORT: "8000"
        FRONTEND_PORT: "3000"
      start: /opt/venv/bin/reflex run --env prod
      ports:
        - port: 8000
          httpSupport: true
        - port: 3000
          httpSupport: true
