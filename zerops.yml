# Zerops deployment configuration for Rezno AI
# Docs: https://docs.zerops.io/python/how-to/build-pipeline

zerops:
  - setup: python

    # ── BUILD ────────────────────────────────────────────────────────────────
    # Build phase: just validate deps and deploy source.
    # Frontend (Next.js) is compiled by reflex at runtime start — no Bun needed here.
    build:
      base: python@3.11
      os: ubuntu

      prepareCommands:
        - |
          # Validate requirements exist and install into a venv
          # Note: prepareCommands run in /home/zerops; source code is at /build/source
          python3 -m venv /home/zerops/venv
          /home/zerops/venv/bin/pip install -r /build/source/requirements.txt

      # Deploy the full source tree; .deployignore strips dev/legacy paths
      deployFiles: .

      # Copy requirements.txt to runtime prepare container
      addToRunPrepare:
        - requirements.txt

      # Cache pip downloads between builds
      cache: ~/.cache/pip

    # ── RUN ──────────────────────────────────────────────────────────────────
    run:
      base: python@3.11
      os: ubuntu

      prepareCommands:
        - |
          # 1. Install Bun (Reflex uses it to compile/serve the Next.js frontend)
          #    No root needed — bun installs to $HOME/.bun
          curl -fsSL https://bun.sh/install | bash

          # 2. Create isolated Python environment and install all deps
          #    requirements.txt is copied here by addToRunPrepare (in /home/zerops/)
          python3 -m venv /home/zerops/venv
          /home/zerops/venv/bin/pip install -r /home/zerops/requirements.txt

      ports:
        - port: 8000   # Reflex Python backend + WebSocket
          httpSupport: true
        - port: 3000   # Next.js frontend
          httpSupport: true

      envVariables:
        PORT: "8000"
        FRONTEND_PORT: "3000"
        # Set GOOGLE_API_KEY in Zerops GUI → Service → Environment Variables

      # Add bun to PATH, cd into deployed app dir, then start reflex
      # reflex run --env prod will compile the frontend on first start using bun
      start: bash -c 'export PATH="$HOME/.bun/bin:$PATH" && cd /var/www && /home/zerops/venv/bin/reflex run --env prod'

      healthCheck:
        httpGet:
          port: 8000
          path: /ping
